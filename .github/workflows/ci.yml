name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install-crystal installs packages without refreshing the package
      # index, which fails when the runner image's index has gone stale.
      - name: Update package index
        run: sudo apt-get update -y
      - uses: crystal-lang/install-crystal@v1
      - name: Install dependencies
        run: shards install
      - name: Build
        run: crystal build --no-codegen src/pnggif.cr src/encode.cr
      - name: Run ameba
        run: |
          shards build ameba
          ./bin/ameba
